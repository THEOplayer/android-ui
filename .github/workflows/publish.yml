name: Publish release
on:
  # Runs whenever a release PR is merged
  pull_request:
    branches:
      - main
    types: [ closed ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Publish job
  publish:
    # Run only for "release/x.y.z" PRs, and only when the PR is merged (not abandoned)
    if: ${{ !github.event.pull_request || (startsWith(github.head_ref, 'release/') && github.event.pull_request.merged) }}
    runs-on: ubuntu-latest
    # Sets permissions of the GITHUB_TOKEN to allow publishing to GitHub Packages
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Create app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.THEOPLAYER_BOT_APP_ID }}
          private-key: ${{ secrets.THEOPLAYER_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure Git user
        run: |
          git config user.name 'theoplayer-bot[bot]'
          git config user.email '873105+theoplayer-bot[bot]@users.noreply.github.com'
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # https://github.com/gradle/actions/blob/v6.0.0/README.md#licensing-notice
          cache-disabled: true
      - name: Publish package
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
      - name: Get version
        shell: bash
        # language=bash
        run: |
          echo "version=$(yq '.version' ./gradle.properties)" >> "$GITHUB_ENV"
      - name: Push tag
        # language=bash
        run: |
          git tag "v$version" -m "$version"
          git push origin "v$version"
      - name: Create GitHub release
        # language=bash
        run: |
          notes=$(./gradlew --no-daemon --console=plain --quiet :getChangelog --no-header --project-version="$version")
          gh release create "v$version" --verify-tag --latest \
            --title "$version" \
            --notes "$notes"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
